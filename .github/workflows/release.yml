name: Publish test release
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: douyin-v0.1.0-test
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          cd ..
          if gh release view v0.1.0-test >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v0.1.0-test dist/DouyinSwitch-0.1.0-test.nsp dist/DouyinSwitch-0.1.0-test.zip dist/SHA256SUMS.txt --target "$COMMIT_SHA" --title '抖音网页版 v0.1.0 · 测试版' --notes-file RELEASE_NOTES.md --prerelease
